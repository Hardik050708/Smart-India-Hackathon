name: Frontend Smoke Test

# Render-level regression gate for the portal.
# Deliberately separate from "Deploy to GitHub Pages" so a failing check is visible
# without ever blocking a deployment.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Headless Render Smoke Test
        run: npm run smoke

      - name: Production Build
        run: npm run build
